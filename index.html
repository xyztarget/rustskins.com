<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustSkins</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111315;
            color: white;
        }

        header {
            background: #1a1d20;
            padding: 20px 40px;
            border-bottom: 1px solid #292d31;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #e67e22;
        }

        /* POČÍTADLO */

        #visitor-count {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .visitor-icon {
            width: 15px;
            height: 18px;
            position: relative;
            display: inline-block;
        }

        .visitor-icon::before {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            background: #e53935;
            border-radius: 50%;
            top: 0;
            left: 4px;
        }

        .visitor-icon::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 9px;
            background: #e53935;
            border-radius: 9px 9px 3px 3px;
            bottom: 0;
            left: 0;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #999;
            margin-bottom: 25px;
        }

        .search {
            width: 100%;
            max-width: 600px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1b1e21;
            color: white;
            font-size: 16px;
        }

        .search::placeholder {
            color: #777;
        }

        .skins {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .skin {
            background: #1a1d20;
            border: 1px solid #292d31;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .skin:hover {
            transform: translateY(-3px);
            border-color: #e67e22;
        }

        .skin img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #222;
        }

        .skin-info {
            padding: 15px;
        }

        .skin-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #e67e22;
            font-size: 18px;
            font-weight: bold;
        }

        #status {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {

            header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 24px;
            }

            #visitor-count {
                font-size: 14px;
            }

            .container {
                padding: 30px 15px;
            }

            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-content">

        <div class="logo">
            Rust<span>Skins</span>
        </div>

        <div id="visitor-count">
            <span class="visitor-icon"></span>
            <span id="visitor-number">0</span>
        </div>

    </div>

</header>


<div class="container">

    <div class="hero">

        <h1>Rust Skins Database</h1>

        <p>
            Browse Rust skins, prices and categories.
        </p>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search for a skin..."
        >

    </div>


    <div id="status">
        Loading skins...
    </div>


    <div id="skins" class="skins"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://nckagjgdvnswxldwjdsu.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_rtdelUWxxhn6alvssf4QVg_q6yLvPBs";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allSkins = [];


/* =========================
   NAČÍTANIE SKINOV
========================= */

async function loadSkins() {

    const { data, error } =
        await supabaseClient
            .from("skins")
            .select("*")
            .order("name");

    if (error) {

        document.getElementById("status").textContent =
            "Chyba pri načítaní skinov.";

        console.error(error);

        return;
    }

    allSkins = data;

    displaySkins(data);
}


/* =========================
   ZOBRAZENIE SKINOV
========================= */

function displaySkins(skins) {

    const container =
        document.getElementById("skins");

    if (skins.length === 0) {

        container.innerHTML =
            "<p>Žiadne skiny zatiaľ nie sú v databáze.</p>";

        document.getElementById("status").textContent = "";

        return;
    }

    document.getElementById("status").textContent = "";

    container.innerHTML =
        skins.map(skin => `

            <div class="skin">

                <img
                    src="${skin.image_url}"
                    alt="${skin.name}"
                >

                <div class="skin-info">

                    <div class="skin-name">
                        ${skin.name}
                    </div>

                    <div class="price">
                        $${skin.price}
                    </div>

                </div>

            </div>

        `).join("");
}


/* =========================
   VYHĽADÁVANIE
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {

            const search =
                this.value.toLowerCase();

            const filtered =
                allSkins.filter(
                    skin =>
                        skin.name
                            .toLowerCase()
                            .includes(search)
                );

            displaySkins(filtered);

        }
    );


/* =========================
   POČÍTADLO NÁVŠTEVNÍKOV
========================= */

async function countVisitor() {

    let visitorId =
        localStorage.getItem(
            "rustskins_visitor_id"
        );


    if (!visitorId) {

        visitorId =
            crypto.randomUUID();

        localStorage.setItem(
            "rustskins_visitor_id",
            visitorId
        );


        const { error } =
            await supabaseClient
                .from("visitors")
                .insert({
                    visitor_id: visitorId
                });


        if (error) {

            console.error(
                "Visitor insert error:",
                error
            );

        }

    }


    const { count, error } =
        await supabaseClient
            .from("visitors")
            .select("*", {
                count: "exact",
                head: true
            });


    if (error) {

        console.error(
            "Visitor count error:",
            error
        );

        return;
    }


    document.getElementById(
        "visitor-number"
    ).textContent = count;

}


/* =========================
   SPUSTENIE
========================= */

loadSkins();

countVisitor();

</script>

</body>
</html>

document.getElementById("visitor-number").textContent = count;
