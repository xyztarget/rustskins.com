<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustSkins</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111315;
            color: white;
        }

        header {
            background: #1a1d20;
            padding: 20px 40px;
            border-bottom: 1px solid #292d31;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #e67e22;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #999;
            margin-bottom: 25px;
        }

        .search {
            width: 100%;
            max-width: 600px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1b1e21;
            color: white;
            font-size: 16px;
        }

        .skins {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .skin {
            background: #1a1d20;
            border: 1px solid #292d31;
            border-radius: 10px;
            overflow: hidden;
        }

        .skin img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #222;
        }

        .skin-info {
            padding: 15px;
        }

        .skin-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #e67e22;
            font-size: 18px;
            font-weight: bold;
        }

        #status {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Rust<span>Skins</span></div>
</header>

<div class="container">

    <div class="hero">
        <h1>Rust Skins Database</h1>
        <p>Browse Rust skins, prices and categories.</p>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search for a skin..."
        >
    </div>

    <div id="status">Loading skins...</div>

    <div id="skins" class="skins"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "SEM_DAJ_SVOJU_PROJECT_URL";
const SUPABASE_KEY = "SEM_DAJ_SVOJ_PUBLISHABLE_KEY";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let allSkins = [];

async function loadSkins() {
    const { data, error } = await supabaseClient
        .from("skins")
        .select("*")
        .order("name");

    if (error) {
        document.getElementById("status").textContent =
            "Chyba pri načítaní skinov.";
        console.error(error);
        return;
    }

    allSkins = data;
    displaySkins(data);
}

function displaySkins(skins) {
    const container = document.getElementById("skins");

    if (skins.length === 0) {
        container.innerHTML = "<p>Žiadne skiny zatiaľ nie sú v databáze.</p>";
        document.getElementById("status").textContent = "";
        return;
    }

    document.getElementById("status").textContent = "";

    container.innerHTML = skins.map(skin => `
        <div class="skin">
            <img src="${skin.image_url}" alt="${skin.name}">
            <div class="skin-info">
                <div class="skin-name">${skin.name}</div>
                <div class="price">$${skin.price}</div>
            </div>
        </div>
    `).join("");
}

document.getElementById("search").addEventListener("input", function() {
    const search = this.value.toLowerCase();

    const filtered = allSkins.filter(skin =>
        skin.name.toLowerCase().includes(search)
    );

    displaySkins(filtered);
});

loadSkins();
</script>

</body>
</html>
